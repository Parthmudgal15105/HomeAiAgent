name: Validate operator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            diagnostic_gateway/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - name: Backend, integration, agent, gateway, and deployment guard tests
        run: python -m pytest backend/tests diagnostic_gateway/tests scripts/tests -q
      - name: Scripted orchestration regression (no live infrastructure)
        run: python -m evals.run --provider scripted --output-dir /tmp/aiops-evaluation

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan source without exporting credential values
        run: python3 scripts/secret_scan.py --tracked
      - name: Check deployment shell syntax
        run: bash -n scripts/deploy.sh scripts/install_gateway.sh scripts/backup.sh
